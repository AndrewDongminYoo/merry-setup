---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - actionlint@1.7.8
    - markdownlint@0.49.1
    - shellcheck@0.11.0
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-check-pre-push
