---
name: Integration

# Real SDK installation on a Linux x64 runner. Manual or release-gated only:
# each job downloads a full Dart or Flutter SDK, so it does not run on every push.
on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  dart-default:
    name: Dart stable, Merry, dart bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Create Dart fixture project
        run: |
          mkdir -p fixture
          printf 'name: fixture_dart\nenvironment:\n  sdk: ^3.12.0\n' >fixture/pubspec.yaml

      - name: Run Merry Setup
        uses: ./
        with:
          sdk: dart
          bootstrap: dart
          project-dir: fixture

      - name: Verify tools from a later step
        run: |
          dart --version
          merry --version
          test -d "${PUB_CACHE}"

  flutter-melos-flutterfire:
    name: Flutter stable, Melos, FlutterFire, precache
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Create Melos workspace fixture
        run: |
          mkdir -p fixture/packages/app
          printf 'name: fixture_workspace\nenvironment:\n  sdk: ^3.12.0\nworkspace:\n  - packages/app\ndev_dependencies:\n  melos: ^7.0.0\n' >fixture/pubspec.yaml
          printf 'name: fixture_app\nenvironment:\n  sdk: ^3.12.0\nresolution: workspace\n' >fixture/packages/app/pubspec.yaml

      - name: Run Merry Setup
        uses: ./
        with:
          sdk: flutter
          bootstrap: melos
          project-dir: fixture
          bundles: |
            flutterfire
          precache: |
            android
            web
            linux

      - name: Verify tools from a later step
        run: |
          flutter --version
          melos --version
          flutterfire --version
          firebase --version

  # Requirement 20 asks this matrix for exact Dart 3.12.0 with Merry and Very Good CLI activation.
  # It deliberately does not run 'bootstrap: very-good': Very Good CLI documents the Flutter SDK as
  # a prerequisite, so that strategy cannot succeed in a Dart-only environment.
  dart-exact-very-good:
    name: Dart 3.12.0, Merry, Very Good CLI activation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Create Dart fixture project
        run: |
          mkdir -p fixture
          printf 'name: fixture_very_good\nenvironment:\n  sdk: ^3.12.0\n' >fixture/pubspec.yaml

      - name: Run Merry Setup
        uses: ./
        with:
          sdk: dart
          sdk-version: 3.12.0
          bootstrap: dart
          project-dir: fixture
          dart-packages: |
            very_good_cli

      - name: Verify tools from a later step
        run: |
          dart --version | grep -F '3.12.0'
          merry --version
          very_good --version

  cache-save:
    name: Save exact Dart SDK archive cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dart-version: ${{ steps.versions.outputs.dart-version }}
      merry-version: ${{ steps.versions.outputs.merry-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Create Dart fixture and archive-request audit
        run: |
          mkdir -p fixture "${RUNNER_TEMP}/curl-audit/bin"
          printf 'name: fixture_cache_save\nenvironment:\n  sdk: ^3.12.0\n' >fixture/pubspec.yaml
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'for argument in "$@"; do' \
            '  if [[ ${argument} == "${SDK_ARCHIVE_URL}" ]]; then printf "%s\\n" "${argument}" >>"${SDK_ARCHIVE_REQUEST_LOG}"; fi' \
            'done' \
            'exec /usr/bin/curl "$@"' >"${RUNNER_TEMP}/curl-audit/bin/curl"
          chmod +x "${RUNNER_TEMP}/curl-audit/bin/curl"
          : >"${RUNNER_TEMP}/sdk-archive-requests.log"
          printf '%s\n' "${RUNNER_TEMP}/curl-audit/bin" >>"${GITHUB_PATH}"
          printf '%s\n' \
            'SDK_ARCHIVE_URL=https://storage.googleapis.com/dart-archive/channels/stable/release/3.12.0/sdk/dartsdk-linux-x64-release.zip' \
            "SDK_ARCHIVE_REQUEST_LOG=${RUNNER_TEMP}/sdk-archive-requests.log" >>"${GITHUB_ENV}"

      - name: Run Merry Setup and save the archive
        uses: ./
        with:
          sdk: dart
          sdk-version: 3.12.0
          cache: true
          merry-version: 2.4.0
          bootstrap: dart
          project-dir: fixture

      - name: Record exact resolved versions
        id: versions
        run: |
          dart_version="$(dart --version 2>&1)"
          merry_version="$(merry --version 2>&1)"
          grep -Fq '3.12.0' <<<"${dart_version}"
          grep -Fq '2.4.0' <<<"${merry_version}"
          test -f "${RUNNER_TEMP}/merry-setup/sdk-archives/dart/3.12.0/sdk-archive"
          printf 'dart-version=%s\n' "${dart_version}" >>"${GITHUB_OUTPUT}"
          printf 'merry-version=%s\n' "${merry_version}" >>"${GITHUB_OUTPUT}"

  cache-restore:
    name: Restore exact Dart SDK archive cache on a fresh runner
    needs: cache-save
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Create Dart fixture and archive-request audit
        run: |
          mkdir -p fixture "${RUNNER_TEMP}/curl-audit/bin"
          printf 'name: fixture_cache_restore\nenvironment:\n  sdk: ^3.12.0\n' >fixture/pubspec.yaml
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            'for argument in "$@"; do' \
            '  if [[ ${argument} == "${SDK_ARCHIVE_URL}" ]]; then printf "%s\\n" "${argument}" >>"${SDK_ARCHIVE_REQUEST_LOG}"; fi' \
            'done' \
            'exec /usr/bin/curl "$@"' >"${RUNNER_TEMP}/curl-audit/bin/curl"
          chmod +x "${RUNNER_TEMP}/curl-audit/bin/curl"
          : >"${RUNNER_TEMP}/sdk-archive-requests.log"
          printf '%s\n' "${RUNNER_TEMP}/curl-audit/bin" >>"${GITHUB_PATH}"
          printf '%s\n' \
            'SDK_ARCHIVE_URL=https://storage.googleapis.com/dart-archive/channels/stable/release/3.12.0/sdk/dartsdk-linux-x64-release.zip' \
            "SDK_ARCHIVE_REQUEST_LOG=${RUNNER_TEMP}/sdk-archive-requests.log" >>"${GITHUB_ENV}"

      - name: Run Merry Setup from the saved archive
        uses: ./
        with:
          sdk: dart
          sdk-version: 3.12.0
          cache: true
          merry-version: 2.4.0
          bootstrap: dart
          project-dir: fixture

      - name: Verify restored state and no upstream archive request
        env:
          EXPECTED_DART_VERSION: ${{ needs.cache-save.outputs.dart-version }}
          EXPECTED_MERRY_VERSION: ${{ needs.cache-save.outputs.merry-version }}
        run: |
          test ! -s "${SDK_ARCHIVE_REQUEST_LOG}"
          test "$(dart --version 2>&1)" = "${EXPECTED_DART_VERSION}"
          test "$(merry --version 2>&1)" = "${EXPECTED_MERRY_VERSION}"
          test -f "${RUNNER_TEMP}/merry-setup/sdk-archives/dart/3.12.0/sdk-archive"
