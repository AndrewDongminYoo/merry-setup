---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bash implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test offline secret reader
        run: python3 -B .trunk/configs/tests/test_trufflehog_to_sarif.py

      - name: Check Bash syntax
        run: |
          for script in bin/merry-setup action/preflight.sh action/resolve.sh action/run.sh test/*.sh; do
            bash -n "$script" || exit
          done

      - name: Run ShellCheck
        run: shellcheck bin/merry-setup action/preflight.sh action/resolve.sh action/run.sh test/*.sh

      - name: Run test suite
        run: bash test/run.sh

      - name: Set up Trunk launcher
        uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

      - name: Run Trunk checks
        run: '"$TRUNK_PATH" check --all --no-progress --no-fix'
