---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Bash implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6, verified 2026-08-28
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: bash -n bin/merry-setup action/preflight.sh action/resolve.sh action/run.sh test/*.sh

      - name: Run ShellCheck
        run: shellcheck bin/merry-setup action/preflight.sh action/resolve.sh action/run.sh test/*.sh

      - name: Run test suite
        run: bash test/run.sh

      - name: Set up Trunk launcher
        uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa  # v2.0.0

      - name: Run Trunk checks
        run: '"$TRUNK_PATH" check --all --no-progress --no-fix'
